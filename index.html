<!DOCTYPE htm>
<htm lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- thẻ meta có tên: viewport này để web có thể hiển thị trên mọi thiết bị -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soléa — Fashion for a Brighter You</title>
    <!-- (cmt) Tailwind CSS(242 màu) là một thư viện CSS giúp thiết kế giao diện website nhanh hơn mà không cần tự viết quá nhiều CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            50: '#fdf2f5',
                            100: '#fce7f0',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            400: '#db2777',
                            500: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Dòng này có nghĩa là: trang này lket với file css qua thẻ link -->
     <!-- rel="stylesheet" có nghĩa khai báo đường link này là để lk với 1 trang tạo kiểu
     href="style.css" dchi của trang css -->
    <!-- (cmt) -->
</head>
<body class="flex flex-col min-h-screen text-gray-800">
    <!-- HEADER / NAVIGATION BAR -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pastel-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center gap-4">
            <!-- Logo -->
            <div onclick="showPage('home')" class="cursor-pointer flex items-center space-x-2">
                
<img src="phần_ảnh_của_web/ảnh_logo.png"
     alt="Soléa logo"
     class="h-10 w-10 object-contain">

<span class="text-3xl tracking-tight text-[#593b30]"
      style="font-family:Georgia,serif">
    Soléa
</span>
<!-- thẻ div dùng để chia web thành từng phần, tạo bố cục phục vụ việc trang trí -->
            </div>

            <!-- Menu Điều Hướng (Đã thêm VOUCHER) -->
            <nav class="flex flex-1 justify-start ml-8 space-x-5 text-xs font-bold text-gray-600">
                <button onclick="showPage('home')" class="nav-btn text-pastel-400 hover:text-pastel-400">Trang Chủ</button>
                <button onclick="showPage('store')" class="nav-btn hover:text-pastel-400">Cửa Hàng</button>
                <button onclick="showPage('themes')" class="nav-btn hover:text-pastel-400">Blog
</button>
                <button onclick="toggleVoucherModal()" class="nav-btn text-amber-500 hover:text-amber-600 flex items-center space-x-1">
                    <i class="fa-solid fa-ticket"></i>
                    <span>Voucher</span>
                </button>
            </nav>

            <!-- Giỏ Hàng -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleCartModal()" class="relative p-2 text-gray-700 hover:text-pastel-400 transition" aria-label="Mở giỏ hàng">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute top-0 right-0 bg-pastel-400 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <!-- Nút Đăng nhập mới -->
                <button onclick="toggleLoginModal()" class="flex items-center space-x-1 bg-pastel-50 border border-pastel-200 text-pastel-500 hover:bg-pastel-300 hover:text-white px-3 py-1.5 rounded-full text-xs font-bold transition">
                    <i class="fa-regular fa-user text-sm"></i>
                    <span>Đăng nhập</span>
                </button>
            </div>
        </div>
    </header>

    <!-- JAVASCRIPT LOGIC (cho vo cmt) -->
   <script src="script.js"></script>
</body>
</htm>
